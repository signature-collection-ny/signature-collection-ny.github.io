function hairTone(v){v=v.toUpperCase();if(v.includes('GREEN'))return'#315844';if(v.includes('ASHLEY'))return'#d7c2a1';if(v.includes('BLONDE')||v==='60'||v.includes('613'))return'#e6d29a';if(v.includes('CARAMEL')||v.includes('27'))return'#b97831';if(v.includes('HAZEL')||v.includes('30'))return'#8b4d2d';if(v.includes('COPPER')||v.includes('707')||v.includes('710'))return'#9f4427';if(v.includes('BURG')||v.includes('WINE')||v.includes('99J')||v.includes('RED')||v.includes('6001'))return'#6f1425';if(v.includes('280')||v.includes('51')||v==='1010')return'#80756d';if(v.includes('4'))return'#4a2a1e';if(v.includes('3'))return'#593622';if(v.includes('2'))return'#2b1c18';if(v.includes('1B'))return'#171414';if(v==='1')return'#080808';return'#493126'}

<script>
(function(){
  let lastColorTrigger=null;
  function ensureColorZoom(){
    let modal=document.getElementById('colorZoom');
    if(modal)return modal;
    modal=document.createElement('div');
    modal.id='colorZoom';
    modal.className='color-zoom';
    modal.setAttribute('role','dialog');
    modal.setAttribute('aria-modal','true');
    modal.setAttribute('aria-labelledby','colorZoomCode');
    modal.innerHTML='<div class="color-zoom-card"><button class="color-zoom-close" type="button" aria-label="Close color preview">&times;</button><div class="color-zoom-label">HAIR COLOR PREVIEW</div><div class="color-zoom-swatch" aria-hidden="true"></div><div class="color-zoom-code" id="colorZoomCode"></div><p class="color-zoom-note">Actual color may vary by screen.</p></div>';
    document.body.appendChild(modal);
    modal.querySelector('.color-zoom-close').addEventListener('click',closeColorZoom);
    modal.addEventListener('click',event=>{if(event.target===modal)closeColorZoom()});
    return modal;
  }
  function openColorZoom(code,trigger){
    const modal=ensureColorZoom();
    lastColorTrigger=trigger||null;
    modal.querySelector('.color-zoom-swatch').style.setProperty('--hair',hairStyle(code));
    modal.querySelector('.color-zoom-code').textContent=code;
    modal.classList.add('show');
    document.body.style.overflow='hidden';
    modal.querySelector('.color-zoom-close').focus();
  }
  function closeColorZoom(){
    const modal=document.getElementById('colorZoom');
    if(!modal||!modal.classList.contains('show'))return;
    modal.classList.remove('show');
    document.body.style.overflow='';
    lastColorTrigger?.focus();
    lastColorTrigger=null;
  }
  function enhanceColorChips(root=document){
    root.querySelectorAll('.chip.hair-swatch').forEach(chip=>{
      const code=chip.textContent.trim();
      if(!COLOR_CODES.has(code))return;
      chip.setAttribute('role','button');
      chip.setAttribute('tabindex','0');
      chip.setAttribute('aria-label',`View ${code} color larger`);
    });
  }
  function removeOriginalCardButtons(root=document){root.querySelectorAll('.source,#source').forEach(button=>button.remove())}
  document.addEventListener('click',event=>{
    const chip=event.target.closest('.chip.hair-swatch');
    if(!chip||!COLOR_CODES.has(chip.textContent.trim()))return;
    event.preventDefault();
    openColorZoom(chip.textContent.trim(),chip);
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){closeColorZoom();return}
    const chip=event.target.closest?.('.chip.hair-swatch');
    if(!chip||!COLOR_CODES.has(chip.textContent.trim())||!['Enter',' '].includes(event.key))return;
    event.preventDefault();
    openColorZoom(chip.textContent.trim(),chip);
  });
  const colorZoomObserver=new MutationObserver(()=>{enhanceColorChips();removeOriginalCardButtons()});
  colorZoomObserver.observe(document.body,{childList:true,subtree:true});
  ensureColorZoom();enhanceColorChips();removeOriginalCardButtons();
})();
